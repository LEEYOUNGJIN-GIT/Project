name: CISA Generate — 도메인 연계

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "1=문제만, 2=정답+해설"
        type: choice
        options: ["1", "2"]
        default: "1"
      count:
        description: "문항 수 (비우면 기본 2, pair별 1문항 권장)"
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r CISA/scripts/requirements.txt
      - name: Generate cross-domain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CISA_MODE: CROSS
          CISA_PHASE: ${{ github.event.inputs.phase }}
          CISA_COUNT: ${{ github.event.inputs.count }}
        run: python CISA/scripts/generate_questions.py
      - uses: actions/upload-artifact@v4
        with:
          name: cisa-CROSS-phase${{ github.event.inputs.phase }}
          path: CISA/output/
