# CISA 문제 생성 로직 트리 설정
# CISA_MODE 환경변수 → 이 파일의 modes.* 항목과 매칭

repo:
  # 교재(MASTER, KOREAN, D1~D5)는 repo 루트. 로컬 eng/C1 개발 시: CISA_MATERIALS_DIR=C1
  materials_dir: "."
  output_dir: CISA/output

modes:
  D1:
    type: single
    label: "D1 — IS 감사 프로세스"
    source_file: D1_IS감사프로세스.md
    eco_weight: "18%"
    default_count: 2
    track_ratio: "A 70% / B 30%"

  D2:
    type: single
    label: "D2 — 거버넌스·IT 관리"
    source_file: D2_거버넌스IT관리.md
    eco_weight: "18%"
    default_count: 2
    track_ratio: "A 70% / B 30%"

  D3:
    type: single
    label: "D3 — 시스템 도입·개발·구현"
    source_file: D3_시스템도입개발구현.md
    eco_weight: "12%"
    default_count: 1
    track_ratio: "A 70% / B 30%"

  D4:
    type: single
    label: "D4 — 운영·비즈니스 복원성"
    source_file: D4_운영비즈니스복원성.md
    eco_weight: "26%"
    default_count: 3
    track_ratio: "A 70% / B 30%"

  D5:
    type: single
    label: "D5 — 정보자산 보호"
    source_file: D5_정보자산보호.md
    eco_weight: "26%"
    default_count: 3
    track_ratio: "A 70% / B 30%"

  CROSS:
    type: cross
    label: "도메인 연계 문항"
    default_count: 2
    # 실전 세트 기준 연계 10~20% (10문항 → 1~2문항). 연계 전용 워크플로는 2문항 고정.
    track_ratio: "A 80% / B 20%"
    cross_pairs:
      - id: D1-D2
        domains: [D1, D2]
        frequency: high
        topics: "감사 헌장↔거버넌스, 위험 평가↔ERM, 감사위원회 보고 경로"
      - id: D2-D5
        domains: [D2, D5]
        frequency: high
        topics: "감사권(Right to Audit), SOC 2 증거 한계, 보안 책임=원조직, 공유 책임 모델"
      - id: D1-D3
        domains: [D1, D3]
        frequency: medium
        topics: "프로젝트 감사, 미승인 비즈니스 케이스, Agile 증적·UAT, PIR 목적"
      - id: D3-D4
        domains: [D3, D4]
        frequency: medium
        topics: "병행·빅뱅 전환, CM 없이 Go-Live, 데이터 마이그레이션 완전성"
      - id: D4-D5
        domains: [D4, D5]
        frequency: medium
        topics: "BCP vs DRP, 랜섬웨어 사후 통제, IR↔BCP·백업 무결성"
      - id: D1-D5
        domains: [D1, D5]
        frequency: low
        topics: "CAATs↔로그, 포렌식·디지털 증적 보전"

shared:
  always_load:
    - KOREAN.md
  master_excerpt_max_chars: 120000
  model: gemini-2.0-flash
  phase_default: "1"
