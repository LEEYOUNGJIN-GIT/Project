name: CISA Generate D4

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: ["1", "2"]
        default: "1"
      count:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r CISA/scripts/requirements.txt
      - name: Check GEMINI_API_KEY
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY secret missing"
            exit 1
          fi
      - name: Generate D4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CISA_MODE: D4
          CISA_PHASE: ${{ github.event.inputs.phase }}
          CISA_COUNT: ${{ github.event.inputs.count }}
        run: python CISA/scripts/generate_questions.py
      - uses: actions/upload-artifact@v4
        with:
          name: cisa-D4-phase${{ github.event.inputs.phase }}
          path: CISA/output/
          if-no-files-found: error
